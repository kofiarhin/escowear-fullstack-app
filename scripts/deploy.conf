# Per-project settings. Do not put credentials in this file.
DEPLOY_PROJECT=escowear
DEPLOY_SERVICE=web
DEPLOY_IMAGE=escowear
DEPLOY_BRANCH=master
DEPLOY_REMOTE=github.com/kofiarhin/escowear-fullstack-app
DEPLOY_COMPOSE=compose.yaml
DEPLOY_DOCKER="sudo docker"
DEPLOY_HEALTH_URL=http://127.0.0.1:5080/health
DEPLOY_PUBLIC_URL=https://escowear.com/health
DEPLOY_KEEP_RELEASES=3
DEPLOY_HEALTH_RETRIES=30
DEPLOY_HEALTH_DELAY=5
DEPLOY_BACKEND_TEST_COMMAND="node --test server/tests/*.test.js"
