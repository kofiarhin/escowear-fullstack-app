# Per-project settings. Do not put credentials in this file.
DEPLOY_PROJECT=escowear
DEPLOY_SERVICE=web
DEPLOY_IMAGE=escowear
DEPLOY_BRANCH=master
DEPLOY_REMOTE=github.com/kofiarhin/escowear-fullstack-app
DEPLOY_COMPOSE=compose.yaml
# Once this checkout exists, every deploy must run from it (one lock, one release state).
DEPLOY_PRODUCTION_ROOT=/home/ubuntu/deploy/escowear
DEPLOY_DOCKER="sudo docker"
DEPLOY_HEALTH_URL=http://127.0.0.1:5080/health
DEPLOY_PUBLIC_URL=https://escowear.com/health
DEPLOY_KEEP_RELEASES=3
DEPLOY_HEALTH_RETRIES=30
DEPLOY_HEALTH_DELAY=5
DEPLOY_BACKEND_TEST_COMMAND="node --test server/tests/*.test.js"
# Runs as the image's unprivileged user: every runtime file readable, every directory
# traversable, nothing writable outside the private /app/data store. Any find error
# (such as an unlistable directory hiding its contents) also fails. CI runs the same.
DEPLOY_PERMISSION_CHECK_COMMAND='out="$(find /app -path /app/data -prune -o \( ! -readable -o -writable -o \( -type d ! -executable \) \) -print)" && test -z "$out"'
