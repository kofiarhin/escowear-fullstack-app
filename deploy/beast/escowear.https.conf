# REVIEW ONLY: requires issued certificate before installation.
server {
    listen 80;
    listen [::]:80;
    server_name escowear.com www.escowear.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/escowear-acme;
        try_files $uri =404;
    }
    location / { return 301 https://escowear.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.escowear.com;
    ssl_certificate /etc/letsencrypt/live/escowear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escowear.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://escowear.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name escowear.com;
    ssl_certificate /etc/letsencrypt/live/escowear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escowear.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/escowear.access.log;
    error_log /var/log/nginx/escowear.error.log;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
