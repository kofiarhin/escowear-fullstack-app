# Installed as /etc/ssh/sshd_config.d/99-escowear-deploy.conf (root:root 0644).
# Applies only to escowear-deploy: public key only, forced command, no TTY,
# forwarding, tunnels or user rc files. Other accounts are unaffected.
Match User escowear-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/sbin/escowear-deploy-ssh
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
