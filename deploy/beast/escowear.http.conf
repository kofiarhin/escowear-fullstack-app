# REVIEW ONLY: install only after approval. Use during certificate bootstrap.
server {
    listen 80;
    listen [::]:80;
    server_name escowear.com www.escowear.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/escowear-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
