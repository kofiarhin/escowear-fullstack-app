name: CSS lint

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  css-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check CSS compatibility
        run: npm run lint:css --prefix client
